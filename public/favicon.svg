<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="hvlBg" cx="0" cy="0" r="1" gradientTransform="translate(64 64) rotate(45) scale(88)">
      <stop offset="0%" stop-color="#240705"/>
      <stop offset="60%" stop-color="#0e0606"/>
      <stop offset="100%" stop-color="#050303"/>
    </radialGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="30" fill="url(#hvlBg)"/>
  <rect x="1" y="1" width="126" height="126" rx="29" stroke="#FF3725" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Subtle Vinyl Rings -->
  <circle cx="64" cy="64" r="50" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <circle cx="64" cy="64" r="38" stroke="#FF3725" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Minimalist Clean Monogram HVL -->
  <!-- H -->
  <path d="M28 40V88M48 40V88M28 64H48" stroke="#F4F0EB" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- V (Glowing Red) -->
  <path d="M52 40L64 88L76 40" stroke="#FF3725" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#crimsonGlow)"/>

  <!-- L -->
  <path d="M80 40V88H100" stroke="#F4F0EB" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtle 30 tag at bottom -->
  <rect x="52" y="98" width="24" height="12" rx="6" fill="#FF3725" fill-opacity="0.18"/>
  <text x="64" y="107" fill="#FF3725" font-family="-apple-system, system-ui, sans-serif" font-size="7.5" font-weight="900" text-anchor="middle" letter-spacing="1">30</text>
</svg>